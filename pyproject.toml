[project]
name = "pba-filkom-qa"
version = "0.1.0"
description = "Baseline pencarian passage untuk sistem tanya jawab akademik FILKOM UB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "scikit-learn==1.7.1",
    "spacy-udpipe>=1.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
notebook = ["ipykernel", "nbconvert"]
